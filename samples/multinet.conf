# A Multinet circuit, the part of the datalink layer that is ported.
#
# Run two copies of decnetd with this file and its companion below to see
# a circuit come up between them, or point one at a live pydecnet node.

routing 1.2 --type endnode
node 1.2 CPPND
node 1.1 PYNODE

# The active end of a TCP connection to a peer listening on port 700.
circuit mul-0 Multinet 127.0.0.1:17700:connect

# The passive end would be:
#circuit mul-0 Multinet 127.0.0.1:17700:listen

# UDP mode works but violates the DECnet architecture; decnetd warns.
#circuit mul-1 Multinet 127.0.0.1:17701
