# Bridge containing the NIC and the simulator's tap, so a pcap circuit
# on br0 reaches both.  The bridge takes end0's MAC to keep the DHCP lease.
network:
  version: 2
  renderer: networkd
  ethernets:
    end0:
      dhcp4: no
      dhcp6: no
  bridges:
    br0:
      interfaces: [end0]
      macaddress: "36:61:6c:54:b4:23"
      dhcp4: yes
      dhcp6: no
      dhcp-identifier: mac
      parameters:
        stp: false
        forward-delay: 0
