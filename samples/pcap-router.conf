# The same real Ethernet segment as pcap.conf, but as a level 1 router.
#
# Use this one for bring-up.  A survey of the segment on 10-Sep-2026 found
# exactly one station, the PDP-11 BAJI at 1.19, announcing itself as an
# endnode
# with no designated router:
#
#   endnode-hello endnode vers 2 src 1.19 blksize 576 rtr 0.0 hello 15
#
# Two endnodes on a LAN never form an adjacency -- an endnode adjacency is
# with a router, and there is no router on that segment.  So pcap.conf,
# which makes us an endnode too, can only ever show MOP working and no
# circuit up, and that is correct behaviour rather than a fault.
#
# As a level 1 router we are the thing BAJI is missing, and it tells us
# so on the wire: its hellos carry a neighbour field, empty above, which
# should start naming us once it adopts us as its designated router.  That
# is the confirmation to look for, and it comes from BAJI rather than
# from our own logs.
#
# The handshake runs entirely over multicast -- our router hellos to
# ab-00-00-04-00-00, its endnode hellos to ab-00-00-03-00-00 -- so it does
# not depend on the unicast question noted below.
#
# One thing to watch.  BAJI transmits from 08-00-2b-11-22-33, the
# card's own DEC address, not the Phase IV derived aa-00-04-00-13-04 that
# a node normally programs into its interface.  We address an endnode
# neighbour by its derived address (Macaddr::from_nodeid), so if BAJI
# does not also listen on aa-00-04-00-13-04, hellos will work and unicast
# data will vanish.  MOP loopback to each of the two addresses in turn is
# what settles it.

node 29.150 CPPNOD
node 29.159 BAJI

routing 29.150 --type l1router

circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop
