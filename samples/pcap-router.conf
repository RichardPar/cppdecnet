# Level 1 router on a real Ethernet segment via libpcap.
#
# Use this instead of pcap.conf when the segment has no router: two
# endnodes do not form an adjacency with each other.

node 29.150 CPPNOD
node 29.159 BAJI

routing 29.150 --type l1router

circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop
