# A real Ethernet segment, through libpcap.
#
#   circuit <name> Ethernet pcap:<interface>
#
# This is the one that reaches real hardware.  Three things to know before
# using it:
#
# Privilege.  Capturing and injecting frames needs CAP_NET_RAW.  Either run
# the daemon as root, or grant the capability once:
#
#   sudo setcap cap_net_raw,cap_net_admin+eip build/release/bin/decnetd
#
# Use the release build for that: a sanitizer instrumented binary refuses to
# run with elevated privileges.
#
# The hardware address.  DECnet Phase IV derives a station's Ethernet
# address from its node number -- node 1.20 is aa-00-04-00-14-04 -- and we
# cannot change the interface's address to match.  So the circuit sends
# frames with the derived address as their source while the card keeps its
# own, and captures promiscuously to see the replies.  That works on a
# switched segment, but not on wifi: a managed mode station cannot transmit
# with a source address that is not its own.
#
# The node number.  Pick one that is free.  Two nodes claiming one address
# is worse than not being on the segment at all.

node 1.20 CPPNOD
node 1.19 BAJI

routing 1.20 --type endnode

circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop

# --mop enables the maintenance protocol on the circuit: system id
# announcements, counters requests and loopback.  A real DEC machine will
# answer those, which makes them a good first test -- they need no routing
# adjacency, only a working frame path.
