# Endnode on a real Ethernet segment via libpcap.
#
# Needs CAP_NET_RAW and CAP_NET_ADMIN:
#   sudo setcap cap_net_raw,cap_net_admin+eip build/release/bin/decnetd
#
# Frames are sent with the derived Phase IV source address, so this does
# not work on wireless interfaces.  Use a node number that is not in use
# (tools/pcap-survey.sh).

node 1.20 CPPNOD
node 1.19 BAJI

routing 1.20 --type endnode

# --mop enables system id, counters and loopback.
circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop
