# A Phase IV endnode with one point to point circuit.
#
# This is what the port supports today: the circuit brings up a routing
# adjacency with the node at the other end and keeps it alive with hello
# messages.  Point the peer at a pydecnet node listening on the same port
# and the two will interoperate.

routing 1.2 --type endnode
node 1.2 CPPND
node 1.1 PYNODE

# The far end listens; we connect.  --t3 sets the hello interval.
circuit mul-0 Multinet 127.0.0.1:17700:connect --t3 15

# The matching pydecnet configuration would be:
#   routing 1.1 --type endnode
#   node 1.1 PYNODE
#   node 1.2 CPPND
#   circuit mul-0 Multinet 127.0.0.1:17700:listen
