# An Ethernet circuit carried in UDP datagrams.
#
# Two nodes pointed at each other are a degenerate two station LAN, which
# needs no privilege and no kernel device.  Point this at a pydecnet node
# configured the same way and the two share a LAN.
#
#   udp:<local port>:<peer host>:<peer port>
#
# --random-address gives the circuit a locally administered address, so
# several nodes on one host do not collide.

node 1.2 CPPND
node 1.1 PYNODE
circuit eth-0 Ethernet udp:17802:127.0.0.1:17801 --random-address

# The matching pydecnet configuration would be:
#   circuit eth-0 Ethernet udp:17801:127.0.0.1:17802 --random-address
#
# A TAP device instead (needs privilege, and the device to exist):
#circuit eth-0 Ethernet tap:tap0
