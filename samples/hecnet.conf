# hecnet.conf -- a gateway between the local Ethernet segment and HECnet.
#
# One circuit of each kind.  The hardware on the segment speaks DECnet over
# Ethernet and knows nothing about IP; the HECnet router is reached over TCP
# and knows nothing about the segment.  This node is what joins them, and is
# the only thing on either side that has to understand both.
#
#     [ PDP-11 29.159 BAJI ]---+
#                              |  real Ethernet segment
#                              |
#                   [ us, 29.150 CPPNOD ]   ETH-0 pcap / MUL-0 Multinet
#                              |
#                              |  TCP to 11.22.33.44:9618
#                              |
#                   [ 29.1, area router ]---- the rest of HECnet
#
# READ samples/pcap.conf FIRST.  Everything it says about privilege, the
# derived hardware address, wifi and picking a free node number applies here
# unchanged; this file only adds the second circuit.
#
# ---------------------------------------------------------------------------
# Do not run this while the board is up with the same address.  Two machines
# claiming 29.150 is worse than neither: the far end bounces between them,
# and the symptom is a link that cycles up and down for no visible reason.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------- nodes

node 29.150 CPPNOD      # us, the gateway
node 29.158 RAXDA       # a simh PDP-11 on this machine, over tap0
node 29.159 BAJI        # the PDP-11 on the local segment
# node 29.1 <NAME>      # the HECnet router; add its name once you know it

# --------------------------------------------------------------- routing
#
# Level 1, not level 2.
#
# 29.1 turned out to be an area router in area 29 -- the same area as this
# node -- so a level 1 router forms the adjacency, and out of area traffic
# goes the way the architecture intends: BAJI sends to us, we forward to the
# nearest area router, which is 29.1, and it carries it to the rest of
# HECnet.  We do not need the area table ourselves to reach areas 61 or 62;
# we need a route to 29.1, and being level 1 gives us that.
#
# Use --type l2router only to make this node an area gateway in its own
# right, which is a different job and one 29.1 is already doing.  An earlier
# version of this file said l2router; that was written before the far end's
# address was known, when it still might have been in another area.

routing 29.150 --type l1router

# -------------------------------------------------------------- circuits

# The local segment.  On the development host this is the USB NIC; on the
# Zynq board it is br0, which pdp11-hostd creates at runtime bridging eth0
# with the PDP-11's tap0 so that one circuit reaches both the LAN and the
# guest.  Change the one line.
#
# Needs CAP_NET_RAW:
#     sudo setcap cap_net_raw,cap_net_admin+eip build/release/bin/decnetd
# and that has to be redone after every rebuild, because a relink clears it.
circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop
# circuit eth-0 Ethernet pcap:br0 --t3 10 --mop

# HECnet.  The far end is PyDECnet, which takes the same device string this
# does, so the two sides read:
#
#     here          11.22.33.44:9618:connect
#     their end     <our address>:9618:listen
#
# One end dials and one waits.  Cost 10 against the Ethernet's default 4, so
# anything reachable both ways is preferred over the local segment, which is
# what you want: the wire is faster than the internet.
circuit mul-0 Multinet 11.22.33.44:9618:connect --cost 10

# ------------------------------------------------------------- monitoring
#
# http://localhost:8102/circuits shows both circuits and their state, and
# /nodes shows what is reachable through them.  Easier reading than the
# reachability events, of which the first HECnet update brings dozens.
http --http-port 8102
