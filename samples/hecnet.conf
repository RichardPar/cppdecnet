# Gateway between a local Ethernet segment and HECnet.
# See pcap.conf for pcap requirements.
#
#     [ PDP-11 29.159 ]---+
#                         |  Ethernet
#                [ 29.150 CPPNOD ]   ETH-0 pcap / MUL-0 Multinet
#                         |
#                         |  TCP to 11.22.33.44:9618
#                         |
#                [ 29.1 area router ]---- HECnet

node 29.150 CPPNOD
node 29.158 RAXDA
node 29.159 BAJI

# 29.1 is an area router in the same area, so level 1 is enough.
routing 29.150 --type l1router

# Use pcap:br0 when the host bridges a simulator (see samples/gateway/).
circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --mop
# circuit eth-0 Ethernet pcap:br0 --t3 10 --mop

# The HECnet end listens on 9618.
circuit mul-0 Multinet 11.22.33.44:9618:connect --cost 10

http --http-port 8102
