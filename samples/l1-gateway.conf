# Level 1 router joining an Ethernet segment to a remote node over
# Multinet.  See pcap.conf for pcap requirements.
#
#     [ PDP-11 1.19 ]---+
#                       |  Ethernet
#     [ VAX 1.21 ]------+
#                       |
#                  [ 1.20 ]  ETH-0 pcap / MUL-0 Multinet
#                       |
#                       |  TCP to 11.22.33.44:9999
#                       |
#                  [ 1.10 ]
#
# All nodes are in area 1.  If the remote node is in a different area, use
# --type l2router.

node 1.20 CPPGW
node 1.19 BAJI
node 1.10 FARSID

routing 1.20 --type l1router

circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --priority 64 --mop

# Higher cost and hello timer on the internet circuit.
circuit mul-0 Multinet 11.22.33.44:9999:connect --t3 15 --cost 10

# Remote end:
#   routing 1.10 --type l1router
#   node 1.10 FARSID
#   node 1.20 CPPGW
#   circuit mul-0 Multinet :9999:listen --t3 15 --cost 10
