# A level 1 router acting as a gateway: a real Ethernet segment on one
# side, a Multinet circuit across the internet on the other.
#
# The machines on the local segment speak DECnet over Ethernet and nothing
# else.  The node at 11.22.33.44 can only be reached over IP.  A router
# with one circuit of each kind joins the two.
#
#     [ PDP-11 1.19 ]---+
#                       |  real Ethernet segment
#     [ VAX 1.21 ]------+
#                       |
#                  [ us, 1.20 ]  ETH-0 pcap / MUL-0 Multinet
#                       |
#                       |  TCP to 11.22.33.44:9999
#                       |
#                  [ peer 1.10 ]
#
# READ samples/pcap.conf FIRST.  Everything it says about privilege, the
# derived hardware address, wifi, and picking a free node number applies
# here unchanged -- this file only adds the second circuit.

# ---------------------------------------------------------------- nodes

node 1.20 CPPGW      # us
node 1.19 BAJI       # on the local segment
node 1.10 FARSID     # the far end of the Multinet circuit

# --------------------------------------------------------------- routing
#
# A level 1 router routes within ONE area.  Every node named above is in
# area 1, which is what makes this work.  If the Multinet peer is in a
# different area, a level 1 router will not carry traffic to it -- it will
# hand out of area packets to the nearest level 2 router and there will not
# be one.  Use --type l2router in that case; nothing else in this file
# changes.

routing 1.20 --type l1router

# --------------------------------------------------------------- the LAN
#
# --priority 64 is the designated router election priority.  Endnodes on
# the segment pick the highest; raise it if something else on the wire is
# also a router and you want to be the one chosen, lower it if you do not.
#
# --mop answers system id, counters and loopback requests.  Those work
# without any routing adjacency at all, which makes them the first thing
# to test when the segment is new to you.

circuit eth-0 Ethernet pcap:enx00051be19c68 --t3 10 --priority 64 --mop

# ------------------------------------------------------- the long circuit
#
# We open the connection, so the far end needs the matching :listen line.
# Swap the two if it is the far end that dials out; one end must connect
# and the other must listen.
#
# --cost 10 against the LAN's default of 4.  Cost is what routing uses to
# choose between two ways to the same place, and a TCP circuit over the
# public internet deserves to lose that comparison to a local segment.
#
# --t3 15 is the hello interval.  Longer than the LAN's, because a circuit
# whose round trip goes over the internet should not be declared down for
# one late packet.

circuit mul-0 Multinet 11.22.33.44:9999:connect --t3 15 --cost 10

# The matching configuration at the far end:
#
#   routing 1.10 --type l1router
#   node 1.10 FARSID
#   node 1.20 CPPGW
#   circuit mul-0 Multinet :9999:listen --t3 15 --cost 10
#
# Outbound TCP to port 9999 has to be allowed, and if we are the listening
# end instead then 9999 has to be open inbound and forwarded to this host.

# ------------------------------------------------------------ what to see
#
# Two adjacencies, one per circuit:
#
#   Event type 4.15, Adjacency up
#   From node 1.20 (CPPGW), occurred 11-Sep-2026 07:19:34.197
#       Circuit = ETH-0, Adjacent node = 1.19 (BAJI)
#   circuit MUL-0 up, neighbour 1.10 (L1Router), block size 576
#
# Then the routing tables merge, and each side learns the other's nodes.
# The test that proves it end to end is a loop from one far side to the
# other, through us, over both circuits:
#
#   NCP> LOOP NODE BAJI          -- run on FARSID
#
# If the adjacencies come up but that does not work, the two halves are
# fine and the routing between them is not; `--log-level debug` shows the
# routing messages on both circuits.
